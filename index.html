<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ugly // Weird Cars of the Week</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">

<style>
  :root {
    --magenta: #ff00ff;
    --green:   #00ff00;
    --ink:     #000;
    --paper:   #fff;
    --pad:  3.5vw;
    --bw:   clamp(52px, 8vw, 120px);
    --head: calc(var(--bw) * .5 + max(14px, 2vw) + 2.5vw);
    --font: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 800;
    font-stretch: 62%;
    overflow-x: hidden;
  }

  .top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: var(--head);
    overflow: hidden;
    z-index: 10;
  }
  .burger {
    position: absolute;
    top: max(14px, 2vw);
    left: var(--pad);
    width: var(--bw);
    height: calc(var(--bw) * .5);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .burger::before { content: ""; position: absolute; inset: -14px; }
  .burger:focus-visible { outline: 3px solid var(--magenta); outline-offset: 8px; }

  .bar {
    display: block;
    height: calc(var(--bw) * .1);
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.5) 0 var(--tread-2, 2px), transparent var(--tread-2, 2px) var(--tread-6, 6px), rgba(0,0,0,.8) var(--tread-8, 8px), transparent var(--tread-8, 8px) var(--tread-12, 12px)),
      linear-gradient(180deg, #454545 0%, #080808 24%, #151515 70%, #383838 100%);
    background-size: var(--tread-period, 14px) 100%, 100% 100%;
    transform-origin: 0 50%;
    will-change: transform;
  }
  .bar:nth-child(2) { opacity: .78; }
  .bar:nth-child(3) { opacity: .88; }

  .menu {
    position: absolute;
    top: max(14px, 2vw);
    left: var(--pad);
    right: var(--pad);
    height: calc(var(--bw) * .5);
    padding-left: calc(var(--bw) * .6);
    display: flex;
    justify-content: space-between;
    align-items: center;
    clip-path: inset(-50px 100% -50px 0);
  }
  .menu a {
    color: var(--ink);
    text-decoration: none;
    font-size: clamp(18px, 4vw, 60px);
    line-height: 1;
    padding: 6px 0;
  }
  .menu a:hover { color: var(--magenta); }
  .menu a:focus-visible { outline: 3px solid var(--magenta); outline-offset: 4px; }

  .hero {
    position: relative;
    padding: var(--head) var(--pad) 0;
  }
  .title {
    margin: 0;
    line-height: .8;
    letter-spacing: -.02em;
    color: var(--magenta);
  }
  .line {
    display: block;
    width: max-content;
    white-space: nowrap;
    font-size: 14vw;
  }
  .line--last {
    position: relative;
    padding-left: 1.38em;
  }
  .wheel {
    position: absolute;
    left: .04em;
    top: .384em;
    width: 1.3em;
    height: 1.3em;
    margin-top: -.65em;
    pointer-events: none;
  }
  .wheel img {
    display: block;
    width: 100%;
    height: 100%;
    animation: spin 2.4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .intro { padding: 5vw var(--pad) 45vh; }
  .tag { margin: 0; line-height: 1.09; letter-spacing: -.015em; color: var(--green); }
  .tag span {
    display: block;
    width: max-content;
    white-space: nowrap;
    background: var(--ink);
    padding: 0 .3em;
    font-size: 5.5vw;
  }

  @media (prefers-reduced-motion: reduce) {
    .wheel img { animation: none; }
  }
</style>
</head>

<body>

<header class="top" id="top">
  <button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
  <nav class="menu" id="menu" aria-label="Cars of the week" inert>
    <a href="#car-1">1.</a>
    <a href="#car-2">2.</a>
    <a href="#car-3">3.</a>
    <a href="#car-4">4.</a>
    <a href="#car-5">5.</a>
    <a href="#car-6">6.</a>
    <a href="#car-7">7.</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1 class="title" aria-label="Ugly, weird cars of the week">
      <span class="line" aria-hidden="true">UGLY// WEIRD</span>
      <span class="line" aria-hidden="true">CARS</span>
      <span class="line line--last" aria-hidden="true"><span class="wheel"><img src="wheel.png" alt=""></span>f the week</span>
    </h1>
  </section>

  <section class="intro">
    <p class="tag"><span>An ugly ass</span><span>selection of a few cars each week</span></p>
  </section>
</main>

<script>
(() => {
  const root   = document.documentElement;
  const header = document.getElementById('top');
  const burger = header.querySelector('.burger');
  const bars   = [...burger.querySelectorAll('.bar')];
  const menu   = document.getElementById('menu');
  const lines  = [...document.querySelectorAll('.title .line')];
  const tags   = [...document.querySelectorAll('.tag span')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  /* 1. Tekst over de volle breedte */
  function fitTo(el, target, maxFs) {
    el.style.fontSize = '100px';
    const w = el.getBoundingClientRect().width;
    let fs = 100 * target / w;
    if (maxFs) fs = Math.min(fs, maxFs);
    el.style.fontSize = fs + 'px';
    return fs;
  }
  function fit() {
    const vw  = root.clientWidth;
    const pad = parseFloat(getComputedStyle(burger).left);
    const full = vw - 2 * pad;
    const fs1 = fitTo(lines[0], full);
    fitTo(lines[1], full, fs1 * 1.5);
    fitTo(lines[2], full);
    tags.forEach(t => fitTo(t, full));
    measure();
    render(p);
  }

  /* 2. Hamburger = remspoor */
  const FAN = [-2.4, 0, 2.4];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  let barW = 1, menuW = 1;
  let p = 0, target = 0, last = 0, raf = 0, isOpen = false;

  function measure() {
    const bl = burger.getBoundingClientRect();
    const m  = menu.getBoundingClientRect();
    barW     = bl.width;
    menuW    = m.width;
  }

  function render(v) {
    bars.forEach((bar, i) => {
      const t = clamp((v - i * 0.045) / 0.955, 0, 1);
      const skid = easeOut(t);
      const wobble = Math.sin(t * Math.PI * 2.5 + i * 0.7) * barW * 0.08 * skid;
      const sx = 1 - 0.28 * skid;
      const tx = barW * 0.8 * skid + wobble;
      const ty = FAN[i] * barW * 0.1 * skid;
      const rot = FAN[i] * 11 * skid + Math.sin(t * Math.PI * 2.5 + i * 0.7) * 8 * skid;
      [2, 6, 8, 12, 14].forEach(size => {
        bar.style.setProperty(`--tread-${size === 14 ? 'period' : size}`, `${size / sx}px`);
      });
      bar.style.backgroundPosition = `${-t * barW * 1.5}px 0, 0 0`;
      bar.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scaleX(${sx})`;
      bar.style.opacity = String([1, 0.78, 0.88][i] * (1 - skid));
    });
    const reveal = easeOut(v);
    const edge = menuW * reveal;
    const wave = Math.sin(v * Math.PI) * Math.min(18, menuW * 0.025);
    menu.style.clipPath = `polygon(0 0, ${edge}px 0, ${edge + wave}px 25%, ${edge - wave}px 50%, ${edge + wave * 0.65}px 75%, ${edge}px 100%, 0 100%)`;
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const dir = target > p ? 1 : -1;
    p = clamp(p + dir * dt / 0.95, 0, 1);
    if ((dir > 0 && p >= target) || (dir < 0 && p <= target)) p = target;
    render(p);
    if (p !== target) raf = requestAnimationFrame(loop);
  }

  function setOpen(open) {
    isOpen = open;
    burger.setAttribute('aria-expanded', String(open));
    menu.inert = !open;
    target = open ? 1 : 0;
    cancelAnimationFrame(raf);
    if (reduce.matches) { p = target; render(p); return; }
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  burger.addEventListener('click', e => { e.stopPropagation(); setOpen(!isOpen); });
  menu.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
  document.addEventListener('click', e => { if (isOpen && !header.contains(e.target)) setOpen(false); });
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && isOpen) { setOpen(false); burger.focus(); }
  });

  /* 3. Opstarten */
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener('load', fit);
  addEventListener('resize', fit);
})();
</script>
</body>
</html>
